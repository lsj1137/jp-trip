<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f1e7" />
    <meta name="robots" content="noindex" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="패스 모음" />
    <title>패스 모음</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 메인 화면과 같은 종이 카드 모양. 카드 = 패스, 누르면 지도(map.html), 오른쪽 '이득' 버튼은 설명 창 -->
    <main>
      <div class="top">
        <h1><a class="back" href="/" aria-label="메인으로" onclick="var r=document.referrer;if(history.length>1&&r.indexOf(location.origin+'/')===0&&/^\/(trip\/)?([?#]|$)/.test(r.slice(location.origin.length))){history.back();return false}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg></a><span id="title">패스 모음</span></h1>
        <button type="button" class="loc" id="regionBtn" aria-label="지역 바꾸기"></button>
      </div>
      <ul class="cards" id="cards"></ul>
      <p class="sec" id="allSec" hidden>전국</p>
      <ul class="cards" id="allCards"></ul>
      <p class="foot" id="asof"></p>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
